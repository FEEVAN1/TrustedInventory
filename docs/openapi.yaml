    WarehouseTask:
      type: object
      description: Putaway, rework (OUT-006) and exception (INB-005) tasks (DEC-011).
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          readOnly: true
        version:
          type: integer
          format: int32
          minimum: 1
          description: Optimistic concurrency version, returned as the quoted ETag (API-002).
          readOnly: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        createdBy:
          type: string
          maxLength: 255
          description: OIDC subject of a principal.
          readOnly: true
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        type:
          $ref: "#/components/schemas/TaskType"
        status:
          $ref: "#/components/schemas/TaskStatus"
        warehouseId:
          $ref: "#/components/schemas/Uuid"
        sourceType:
          $ref: "#/components/schemas/DocumentType"
        sourceId:
          $ref: "#/components/schemas/Uuid"
        sourceLineId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        productId:
          $ref: "#/components/schemas/Uuid"
        lotId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        sourceBinId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        quantity:
          $ref: "#/components/schemas/PositiveQuantity"
        remainingQuantity:
          $ref: "#/components/schemas/Quantity"
        recommendedBins:
          type: array
          items:
            $ref: "#/components/schemas/BinRecommendation"
          description: INB-005 ranking; empty for Exception tasks.
        description:
          type:
            - string
            - "null"
          maxLength: 2000
        resolution:
          type:
            - string
            - "null"
          maxLength: 2000
        completedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        completedBy:
          type:
            - string
            - "null"
          maxLength: 255
          description: OIDC subject of a principal.
      required:
        - id
        - version
        - createdAt
        - updatedAt
        - type
        - status
        - warehouseId
        - sourceType
        - sourceId
        - productId
        - quantity
        - remainingQuantity
        - recommendedBins
    WarehouseTaskPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WarehouseTask"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 512
          description: Opaque; null on the last page.
      required:
        - items
        - nextCursor
      additionalProperties: false
    WebhookAck:
      type: object
      description: Returned only after the event is durably stored in the inbox (BIL-004).
      properties:
        received:
          type: boolean
          const: true
        duplicate:
          type: boolean
      required:
        - received
        - duplicate
    WebhookEvent:
      type: object
      description: Inbox metadata only; payloads stay encrypted/redacted and are never listed (section 27).
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          readOnly: true
        provider:
          type: string
          minLength: 1
          maxLength: 40
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        eventType:
          type: string
          minLength: 1
          maxLength: 200
        state:
          $ref: "#/components/schemas/WebhookProcessingState"
        providerEventAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        receivedAt:
          $ref: "#/components/schemas/Timestamp"
        processedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        retries:
          type: integer
          format: int32
          minimum: 0
        failureCode:
          type:
            - string
            - "null"
          maxLength: 64
      required:
        - id
        - provider
        - eventId
        - eventType
        - state
        - providerEventAt
        - receivedAt
        - processedAt
        - retries
        - failureCode
    WebhookEventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 512
          description: Opaque; null on the last page.
      required:
        - items
        - nextCursor
      additionalProperties: false
    WebhookProcessingState:
      type: string
      enum:
        - Received
        - Processed
        - Ignored
        - Quarantined
        - Failed
      description: "Quarantined: references an unknown billing account (AT-BIL-02)."
    WithdrawClosureRequest:
      type: object
      properties:
        reason:
          $ref: "#/components/schemas/Reason"
      required:
        - reason
      additionalProperties: false
    Zone:
      type: object
      description: "Operating range null = uncontrolled ambient. Compatibility rule: DEC-012."
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          readOnly: true
        version:
          type: integer
          format: int32
          minimum: 1
          description: Optimistic concurrency version, returned as the quoted ETag (API-002).
          readOnly: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        createdBy:
          type: string
          maxLength: 255
          description: OIDC subject of a principal.
          readOnly: true
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        warehouseId:
          $ref: "#/components/schemas/Uuid"
        code:
          $ref: "#/components/schemas/Code"
        name:
          $ref: "#/components/schemas/Name"
        tempMinC:
          anyOf:
            - $ref: "#/components/schemas/Celsius"
            - type: "null"
        tempMaxC:
          anyOf:
            - $ref: "#/components/schemas/Celsius"
            - type: "null"
        allowedHazardClasses:
          type: array
          items:
            $ref: "#/components/schemas/Code"
          uniqueItems: true
        system:
          type: boolean
          readOnly: true
        active:
          type: boolean
          readOnly: true
      required:
        - id
        - version
        - createdAt
        - updatedAt
        - warehouseId
        - code
        - name
        - tempMinC
        - tempMaxC
        - allowedHazardClasses
        - system
        - active
    ZonePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 512
          description: Opaque; null on the last page.
      required:
        - items
        - nextCursor
      additionalProperties: false
