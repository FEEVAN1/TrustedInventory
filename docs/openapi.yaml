        expiryDate:
          $ref: "#/components/schemas/Date"
        reason:
          $ref: "#/components/schemas/Reason"
        approvalId:
          $ref: "#/components/schemas/Uuid"
      required:
        - expiryDate
        - reason
        - approvalId
      additionalProperties: false
    ExportFilters:
      type: object
      properties:
        from:
          $ref: "#/components/schemas/Timestamp"
        to:
          $ref: "#/components/schemas/Timestamp"
        warehouseId:
          $ref: "#/components/schemas/Uuid"
        productId:
          $ref: "#/components/schemas/Uuid"
        lotId:
