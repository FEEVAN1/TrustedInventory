  /platform/v1/billing/complimentary-access/{id}/approve:
    servers:
      - url: /
        description: Platform console routes are served at /platform/v1, outside /api/v1 (DEC-037).
    post:
      operationId: approveComplimentaryAccess
      tags:
        - PlatformBilling
      summary: Approve complimentary access (another operator)
      description: Independent approval (section 29); the approver must be a different platform operator from the requester (409 APPROVAL_SELF). Only a pending grant whose expiry has not passed is approved; from then until expiry, revocation, a security suspension or closure, the workspace has the plan's features and limits and no billing restriction (DEC-094).
      x-permission: platform.tenants.manage|platform.billing.manage
      x-access: platform
      x-requirements:
        - BIL-008
        - SOD-8
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplimentaryDecisionRequest"
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplimentaryAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
