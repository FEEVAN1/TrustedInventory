          type: object
          description: Present with SUBSCRIPTION_RESTRICTED or TENANT_SECURITY_SUSPENDED. Payment details are shown only to billing roles (section 29).
          properties:
            action:
              type: string
              minLength: 1
              maxLength: 100
              description: e.g. "contact-owner", "update-payment", "security-review".
            blockedCategory:
              $ref: "#/components/schemas/AccessCategory"
            restrictionReasons:
              type: array
              items:
                $ref: "#/components/schemas/RestrictionReason"
          required:
            - action
            - blockedCategory
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
          description: Present with DOWNGRADE_BLOCKED or RETENTION_BLOCKED.
        ineligibility:
          type: array
          description: Present with RELEASE_INELIGIBLE; every failed MED-001 check (DEC-075).
          items:
            type: object
            properties:
              code:
                type: string
                enum:
