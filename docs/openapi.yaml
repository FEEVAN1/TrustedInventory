        - version
    DocumentType:
      type: string
      enum:
        - Receipt
        - PutawayTask
        - BinTransfer
        - OutboundOrder
        - Shipment
        - Transfer
        - Count
        - Adjustment
        - Return
        - Recall
        - QualityDecision
        - Excursion
        - ExpiryCorrection
    DownloadLink:
