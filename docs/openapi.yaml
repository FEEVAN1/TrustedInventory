          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ComplimentaryAccessStatus"
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplimentaryAccessPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: requestComplimentaryAccess
      tags:
        - PlatformBilling
      summary: Request complimentary access for a workspace
      description: A platform billing operator asks for a published plan's features and limits for a workspace until an expiry at most 366 days ahead, with a reason. It has no effect until another platform operator approves it (section 29, DEC-094). One open (Pending or Active) grant per workspace; audited in the workspace's chain.
      x-permission: platform.billing.manage
      x-access: platform
      x-requirements:
        - BIL-008
        - SOD-8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComplimentaryAccessRequest"
      responses:
        "201":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplimentaryAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
