        tenantId:
          $ref: "#/components/schemas/Uuid"
        entitlementVersion:
          type: integer
          format: int64
          minimum: 1
        subscriptionRevision:
          type: integer
          format: int64
          minimum: 0
        features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureKey"
