      openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration
      description: "Human users: OIDC authorization code with PKCE and MFA; bearer access token (IAM-002). The real issuer is deployment configuration (DEC-002, D02)."
    deviceCredential:
      type: http
      scheme: bearer
      description: Scoped rotating credential for telemetry gateways (TEL-001). Not valid on any other route.
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Selected tenant; must match an active membership (API-001).
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Tenant/principal/route-scoped key retained for at least seven days (STK-007). Retries must reuse the key and payload.
      schema:
        $ref: "#/components/schemas/Uuid"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted integer version from the ETag (API-002).
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        example: '"3"'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from nextCursor; encodes sort position and filter digest (API-004).
      schema:
        type: string
        maxLength: 512
    Sort:
      name: sort
      in: query
      required: false
      description: Documented sort field, `-` prefix for descending. Default `-createdAt`.
      schema:
        type: string
        pattern: ^-?[a-zA-Z]+$
        maxLength: 50
        default: -createdAt
  headers:
    ETag:
      description: Quoted resulting resource version (API-003).
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    Location:
      description: URL of the created or queued resource.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed JSON, invalid cursor or missing Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthenticated.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not authorized, or re-authentication required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource absent within the caller's authorized scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "State conflict: INSUFFICIENT_STOCK, STOCK_BLOCKED, INVALID_STATE, IDEMPOTENCY_MISMATCH, APPROVAL_STALE, APPROVAL_SELF, COUNT_LOCKED or RETRYABLE_CONFLICT."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: "VERSION_CONFLICT: If-Match does not match the current version."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: "PRECONDITION_REQUIRED: If-Match missing."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Field-level validation failure (VALIDATION_FAILED, OVER_RECEIPT, INCOMPATIBLE_BIN, BARCODE_CONFLICT and others).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: RATE_LIMITED.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    ServiceUnavailable:
      description: Temporary failure; safe to retry with the same Idempotency-Key and payload.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
