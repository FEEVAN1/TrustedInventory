          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.example.invalid/.well-known/openid-configuration
      description: "Human users: OIDC authorization code with PKCE and MFA; bearer access token (IAM-002). The real issuer is deployment configuration (DEC-002, D02)."
    deviceCredential:
      type: http
      scheme: bearer
      description: Scoped rotating credential for telemetry gateways (TEL-001). Not valid on any other route.
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Selected tenant; must match an active membership (API-001).
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Tenant/principal/route-scoped key retained for at least seven days (STK-007). Retries must reuse the key and payload.
      schema:
        $ref: "#/components/schemas/Uuid"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted integer version from the ETag (API-002).
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        example: '"3"'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from nextCursor; encodes sort position and filter digest (API-004).
      schema:
        type: string
        maxLength: 512
    Sort:
      name: sort
      in: query
      required: false
      description: Documented sort field, `-` prefix for descending. Default `-createdAt`.
      schema:
        type: string
        pattern: ^-?[a-zA-Z]+$
        maxLength: 50
        default: -createdAt
  headers:
    ETag:
      description: Quoted resulting resource version (API-003).
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    Location:
      description: URL of the created or queued resource.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Malformed JSON, invalid cursor or missing Idempotency-Key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthenticated.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "Authenticated but not authorized: FORBIDDEN, REAUTH_REQUIRED, SUBSCRIPTION_RESTRICTED (with recovery), TENANT_SECURITY_SUSPENDED or FEATURE_NOT_ENABLED (with feature)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource absent within the caller's authorized scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "State conflict: INSUFFICIENT_STOCK, STOCK_BLOCKED, INVALID_STATE, IDEMPOTENCY_MISMATCH, APPROVAL_STALE, APPROVAL_SELF, COUNT_LOCKED or RETRYABLE_CONFLICT. SaaS: PLAN_LIMIT_REACHED (with quota), DOWNGRADE_BLOCKED or RETENTION_BLOCKED (with blockers), TRIAL_NOT_ELIGIBLE."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: "VERSION_CONFLICT: If-Match does not match the current version."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: "PRECONDITION_REQUIRED: If-Match missing."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Field-level validation failure (VALIDATION_FAILED, OVER_RECEIPT, INCOMPATIBLE_BIN, BARCODE_CONFLICT and others).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: RATE_LIMITED.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    ServiceUnavailable:
      description: Temporary failure; safe to retry with the same Idempotency-Key and payload.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
  schemas:
    AcceptInvitationRequest:
      type: object
      description: The caller's verified email must match the invitation; seats are rechecked atomically (ONB-005, AT-ONB-02).
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
      required:
        - token
      additionalProperties: false
    AccessCategory:
      type: string
      enum:
        - identity
        - setup-status
        - read
        - export
        - routine-write
        - safety
        - team-admin
        - protective-admin
        - billing
        - ownership
        - telemetry-ingest
      description: Operation category declared as x-access (DEC-034).
    AccessMode:
      type: string
      enum:
        - Normal
        - Provisioning
        - BillingRestricted
        - SecuritySuspended
        - Closed
        - Deleted
      description: Effective access, computed per request with LFC-001 precedence (docs/saas-state-matrix.md).
    AcknowledgeRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
      additionalProperties: false
    ActorType:
      type: string
      enum:
        - User
        - Service
        - Device
        - System
    Adjustment:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          readOnly: true
        version:
          type: integer
          format: int32
          minimum: 1
          description: Optimistic concurrency version, returned as the quoted ETag (API-002).
          readOnly: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        createdBy:
          type: string
          maxLength: 255
          description: OIDC subject of a principal.
          readOnly: true
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        warehouseId:
          $ref: "#/components/schemas/Uuid"
        bucketId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        binId:
          $ref: "#/components/schemas/Uuid"
        productId:
          $ref: "#/components/schemas/Uuid"
        lotId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        serialId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        qualityStatus:
          $ref: "#/components/schemas/QualityStatus"
        delta:
          $ref: "#/components/schemas/SignedQuantity"
        reasonCode:
          $ref: "#/components/schemas/Code"
        narrative:
          $ref: "#/components/schemas/Reason"
        evidenceAttachmentIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          uniqueItems: true
        status:
          $ref: "#/components/schemas/AdjustmentStatus"
        approvalId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        postedMovementId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        contentDigest:
          $ref: "#/components/schemas/Sha256Hex"
          readOnly: true
      required:
        - id
        - version
        - createdAt
        - updatedAt
        - warehouseId
        - bucketId
        - binId
        - productId
        - lotId
        - serialId
        - qualityStatus
        - delta
        - reasonCode
        - narrative
        - evidenceAttachmentIds
        - status
        - approvalId
        - postedMovementId
        - contentDigest
    AdjustmentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Adjustment"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 512
          description: Opaque; null on the last page.
      required:
        - items
        - nextCursor
      additionalProperties: false
    AdjustmentStatus:
      type: string
      enum:
        - Requested
        - Approved
        - Posted
        - Rejected
        - Cancelled
    Alert:
      type: object
      description: TEL-005 dashboard alert.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          readOnly: true
        version:
          type: integer
          format: int32
          minimum: 1
          description: Optimistic concurrency version, returned as the quoted ETag (API-002).
          readOnly: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        createdBy:
          type: string
          maxLength: 255
          description: OIDC subject of a principal.
          readOnly: true
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        type:
          $ref: "#/components/schemas/AlertType"
        severity:
          $ref: "#/components/schemas/AlertSeverity"
        status:
          $ref: "#/components/schemas/AlertStatus"
        warehouseId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        zoneId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        title:
          $ref: "#/components/schemas/Name"
        detail:
          type: string
          maxLength: 4000
        subjectType:
          type:
            - string
            - "null"
          maxLength: 50
        subjectId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        productIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          uniqueItems: true
        lotIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          uniqueItems: true
        firstAbnormalCelsius:
          anyOf:
            - $ref: "#/components/schemas/Celsius"
            - type: "null"
        lastAbnormalCelsius:
          anyOf:
            - $ref: "#/components/schemas/Celsius"
            - type: "null"
        raisedAt:
          $ref: "#/components/schemas/Timestamp"
        acknowledgedBy:
          type:
            - string
            - "null"
          maxLength: 255
          description: OIDC subject of a principal.
        acknowledgedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      required:
        - id
        - version
        - createdAt
        - updatedAt
        - type
        - severity
        - status
        - warehouseId
        - zoneId
        - title
        - detail
        - productIds
        - lotIds
        - raisedAt
    AlertPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 512
          description: Opaque; null on the last page.
      required:
        - items
        - nextCursor
      additionalProperties: false
    AlertSeverity:
      type: string
      enum:
        - Info
        - Warning
        - High
    AlertStatus:
      type: string
      enum:
        - Open
        - Acknowledged
        - Closed
    AlertType:
      type: string
      enum:
        - Excursion
        - StaleDevice
        - ExpiryApproaching
        - ReconciliationMismatch
        - AuditChainFailure
        - OutboxDeadLetter
        - PutawayException
        - ProvisioningFailed
        - WebhookBacklog
        - EntitlementMismatch
        - BillingReconciliation
    AllocateFefoRequest:
      type: object
      description: Same service as /orders/{id}/allocate with FEFO forced for every line (DEC-006).
      properties:
        orderId:
          $ref: "#/components/schemas/Uuid"
        allowPartial:
          type: boolean
          default: false
      required:
        - orderId
      additionalProperties: false
    AllocateRequest:
      type: object
      description: Allocates the unreserved remainder of persisted order lines (STK-006).
      properties:
        allowPartial:
          type: boolean
          default: false
      additionalProperties: false
    AllocationResult:
      type: object
      description: Partial mode commits available quantities and lists exact shortages; all-or-nothing mode fails with 409 INSUFFICIENT_STOCK and changes nothing (STK-006).
      properties:
        orderId:
          $ref: "#/components/schemas/Uuid"
        allocations:
          type: array
          items:
            type: object
            properties:
              reservationId:
                $ref: "#/components/schemas/Uuid"
              orderLineId:
                $ref: "#/components/schemas/Uuid"
              binId:
                $ref: "#/components/schemas/Uuid"
              lotId:
                anyOf:
                  - $ref: "#/components/schemas/Uuid"
                  - type: "null"
              quantity:
                $ref: "#/components/schemas/PositiveQuantity"
              expiresAt:
                $ref: "#/components/schemas/Timestamp"
            required:
              - reservationId
              - orderLineId
              - binId
              - lotId
              - quantity
              - expiresAt
        shortages:
          type: array
          items:
            type: object
            properties:
              orderLineId:
                $ref: "#/components/schemas/Uuid"
              quantity:
                $ref: "#/components/schemas/PositiveQuantity"
            required:
              - orderLineId
              - quantity
        status:
          $ref: "#/components/schemas/OutboundOrderStatus"
        version:
          type: integer
          format: int32
          minimum: 1
      required:
        - orderId
        - allocations
        - shortages
        - status
        - version
    AcknowledgeAlertRequest:
      type: object
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - note
      additionalProperties: false
    ApproveDeletionRequest:
      type: object
      properties:
        reason:
          $ref: "#/components/schemas/Reason"
      required:
        - reason
      additionalProperties: false
    Approval:
      type: object
      description: Never contains credentials (section 08).
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          readOnly: true
        version:
          type: integer
          format: int32
          minimum: 1
          description: Optimistic concurrency version, returned as the quoted ETag (API-002).
          readOnly: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        createdBy:
          type: string
          maxLength: 255
          description: OIDC subject of a principal.
          readOnly: true
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        subjectType:
          $ref: "#/components/schemas/ApprovalSubjectType"
        subjectId:
          $ref: "#/components/schemas/Uuid"
        subjectVersion:
          type: integer
          format: int32
          minimum: 1
        action:
          $ref: "#/components/schemas/ApprovalAction"
        reason:
          $ref: "#/components/schemas/Reason"
        contentDigest:
          $ref: "#/components/schemas/Sha256Hex"
          description: SHA-256 of the canonical subject content at subjectVersion (IAM-003).
          readOnly: true
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        requesterSubject:
          type: string
          maxLength: 255
          description: OIDC subject of a principal.
          readOnly: true
        approverSubject:
          type:
            - string
            - "null"
          maxLength: 255
          description: OIDC subject of a principal.
        meaning:
          anyOf:
            - $ref: "#/components/schemas/SignatureMeaning"
            - type: "null"
        signatureReason:
          type:
            - string
            - "null"
          maxLength: 1000
        reauthVerifiedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        signedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        expiresAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        consumedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        invalidatedReason:
          type:
            - string
            - "null"
          maxLength: 1000
        proposal:
          anyOf:
            - $ref: "#/components/schemas/ApprovalProposal"
            - type: "null"
          description: What the requester proposes and the signer approves, bound to the approval (DEC-090). Present only for ExpiryCorrection.
      required:
        - id
        - version
        - createdAt
        - updatedAt
        - subjectType
        - subjectId
        - subjectVersion
        - action
        - reason
        - contentDigest
        - status
        - requesterSubject
        - approverSubject
