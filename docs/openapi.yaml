# TrustedInventory API contract (spec v3.0 SaaS baseline). Authored contract-first per DEC-003.
# Enumerations: docs/enums.md. Permissions: docs/permissions.md. Access gating: docs/saas-state-matrix.md.
openapi: 3.1.0
info:
  title: TrustedInventory API
  version: 0.2.0-v3
  summary: Multi-tenant warehouse and inventory management for general and medical goods.
  license:
    name: Proprietary
    identifier: LicenseRef-TrustedInventory-Proprietary
  description: |-
    Contract-first API (DEC-003). This document is the contract for spec v3.0 (SaaS baseline, DEC-032); implemented routes must match it (conformance test).

    ## Conventions (spec section 15)
    - Base path `/api/v1`; health probes are at the host root; the platform console is at `/platform/v1` (DEC-037).
    - camelCase JSON, UUID strings, UTC ISO-8601 timestamps, `YYYY-MM-DD` dates. Enum values are case-sensitive.
    - Quantities are decimal **strings** with up to six fractional digits (DEC-014).
    - `X-Tenant-Id` selects the tenant and is validated against an active membership on every tenant route (API-001, IAM-002). Device credentials and `/platform/*` routes carry no tenant header.
    - `Idempotency-Key` (UUID) is required on every stock-changing POST, marked `x-stock-command: true`. Same key and payload replay the stored response; a different payload returns 409 `IDEMPOTENCY_MISMATCH` (STK-007).
    - `If-Match` with the quoted integer version is required on every PATCH and on every state-transition POST addressed to an existing resource (`/{collection}/{id}/...`). Missing: 428 `PRECONDITION_REQUIRED`; stale: 412 `VERSION_CONFLICT` (API-002). Collection-level commands (`/inventory/receive`, `/putaway/confirm`, `/inventory/bin-transfers`, `/orders/allocate-fefo`, `/quality/*`, `/returns`, `/recalls`, `/telemetry/readings`) identify targets in the body and are protected by idempotency keys and server-side row locks instead.
    - Command bodies never accept actor identifiers or tenant ownership fields (API-002).
    - Lists return `{items, nextCursor}`; default limit 50, maximum 200; default sort `createdAt` descending then `id` (API-004).
    - Errors use `application/problem+json` with the `Problem` schema. 404 means absent within the caller's authorized scope and never reveals another tenant's data.

    ## Extensions
    - `x-permission`: permission from docs/permissions.md. `authenticated` = any signed-in principal; `none` = public; `a|b` = either permission, with the rule stated in the description.
    - `x-requirements`: specification requirement and acceptance IDs the operation implements.
    - `x-stock-command`: stock-changing command requiring `Idempotency-Key`.
    - `x-permission` special values also include `member` = any active member of the tenant in X-Tenant-Id.
    - `x-access`: access category from `AccessCategory`, checked against the tenant's computed access mode using docs/saas-state-matrix.md (DEC-034). Special values: `none` = public or signature-authenticated route outside tenant gating; `platform` = platform console route, outside tenant gating. Routes without a tenant header (signup, invitation acceptance) are gated against the target tenant when one exists.
    - `x-entitlement`: plan feature key (`FeatureKey`) the tenant must have; missing → 403 `FEATURE_NOT_ENABLED`. Never applied to `safety` operations (ENT-006). Body-dependent feature checks are stated in the operation description (DEC-038).
    - `x-quota`: quota key (`QuotaKey`) reserved atomically inside the command transaction; at the limit → 409 `PLAN_LIMIT_REACHED` with `Problem.quota` (ENT-003, ENT-004).

    ## Request pipeline (SAS-005)
    Authenticate → validate membership and warehouse scope → compute access mode and check `x-access` → check `x-permission` → check `x-entitlement` → reserve `x-quota` in the transaction → domain validation and work → audit and outbox, then commit. Every check that does not depend on the body runs before the body is read.

    ## SaaS errors (section 28)
    403 `SUBSCRIPTION_RESTRICTED` and `TENANT_SECURITY_SUSPENDED` carry `Problem.recovery`; 403 `FEATURE_NOT_ENABLED` carries `Problem.feature`; 409 `PLAN_LIMIT_REACHED` carries `Problem.quota`; 409 `DOWNGRADE_BLOCKED` and `RETENTION_BLOCKED` carry `Problem.blockers`; 409 `TRIAL_NOT_ELIGIBLE`. A billing restriction is never reported as a stock shortage. Money is integer minor units with currency and exponent (`Money`, BIL-001).
servers:
  - url: /api/v1
security:
  - oidc: []
tags:
  - name: Health
    description: Liveness and readiness probes (ARC-004).
  - name: Identity
    description: Current principal and tenant memberships.
  - name: Platform
    description: Deprecated v2.0 platform routes under /api/v1/platform; replaced by /platform/v1 (DEC-037).
  - name: Administration
    description: Memberships and role grants (IAM-001).
  - name: Configuration
    description: Versioned tenant configuration (CFG-001).
  - name: Catalog
    description: Units, storage profiles, products, barcodes, partners, lots and serials (section 07).
  - name: Locations
    description: Warehouses, zones and bins (section 07).
  - name: PurchaseOrders
    description: Operational purchase orders (INB-001).
  - name: Receiving
    description: Barcode receiving and receipt posting (INB-002 to INB-004).
  - name: Putaway
    description: Recommended, scan-confirmed putaway (INB-005, INB-006).
  - name: Stock
    description: Stock buckets and the movement ledger (section 09).
  - name: Orders
    description: Outbound orders, allocation and reservations (OUT-001, OUT-002).
  - name: Picking
    description: Scan-validated picking and unpick (OUT-003, OUT-004).
  - name: Dispatch
    description: Dispatch and shipments (OUT-005).
  - name: Transfers
    description: Warehouse transfers through transit (EXC-001).
  - name: Counts
    description: Blind stock counts with independent approval (EXC-003).
  - name: Adjustments
    description: Approved stock adjustments (EXC-004).
  - name: Returns
    description: Customer returns into quarantine (EXC-005).
  - name: Recalls
    description: Recall blocking, impact and closure (EXC-006, EXC-007).
  - name: Quality
    description: Quality status transitions and dispositions (section 13).
  - name: Approvals
    description: Version-bound approvals and signatures (IAM-003, IAM-004).
  - name: Tasks
    description: Putaway, rework and exception tasks.
  - name: Telemetry
    description: Devices, readings and excursions (TEL-001 to TEL-005).
  - name: Alerts
    description: Operational and quality alerts.
  - name: Traceability
    description: Receipt-to-customer lot lineage.
  - name: Audit
    description: Hash-chained audit events (AUD-001 to AUD-003).
  - name: Exports
    description: Asynchronous controlled exports (AUD-004).
  - name: Attachments
    description: Scanned evidence attachments (TEN-005).
  - name: Signup
    description: Verified signup and resumable provisioning (sections 23, 28).
  - name: Plans
    description: Public plan catalog (section 24).
  - name: Billing
    description: Subscription, entitlements, checkout and invoices for owners and billing administrators (sections 24, 25).
  - name: Ownership
    description: Cancellation, ownership transfer and closure (sections 23, 26).
  - name: Webhooks
    description: Signature-authenticated billing provider events (BIL-004).
  - name: PlatformOperations
    description: "Platform console at /platform/v1: tenant metadata, provisioning, security suspension. No stock access (section 29)."
  - name: PlatformBilling
    description: "Platform billing console at /platform/v1: plan catalog and reconciliation (section 29)."
paths:
  /health/live:
    servers:
      - url: /
        description: Health endpoints are served at the host root, outside /api/v1.
    get:
      operationId: getLiveness
      tags:
        - Health
      summary: Liveness probe
      description: Process is running. Performs no dependency checks.
      security: []
      x-permission: none
      x-access: none
      x-requirements:
        - ARC-004
        - API-001
      responses:
        "200":
          description: Healthy.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Healthy
        "503":
          description: Unhealthy.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Unhealthy
                  - Degraded
  /health/ready:
    servers:
      - url: /
        description: Health endpoints are served at the host root, outside /api/v1.
    get:
      operationId: getReadiness
      tags:
        - Health
      summary: Readiness probe
      description: Database and required configuration are available.
      security: []
      x-permission: none
      x-access: none
      x-requirements:
        - ARC-004
        - API-001
      responses:
        "200":
          description: Healthy.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Healthy
        "503":
          description: Unhealthy.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Unhealthy
                  - Degraded
  /me:
    get:
      operationId: getMe
      tags:
        - Identity
      summary: Current principal and active memberships
      x-permission: authenticated
      x-access: identity
      x-requirements:
        - IAM-002
        - API-001
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /memberships:
    get:
      operationId: listMemberships
      tags:
        - Administration
      summary: List memberships
      x-permission: tenant.members.manage
      x-access: read
      x-requirements:
        - IAM-001
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active flag; omitted returns both.
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createMembership
      tags:
        - Administration
      summary: Add member
      x-permission: tenant.members.manage
      x-access: team-admin
      x-quota: active_seats
      x-requirements:
        - IAM-001
        - AUD-001
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMembershipRequest"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /memberships/{id}:
    get:
      operationId: getMembership
      tags:
        - Administration
      summary: Get membership
      x-permission: tenant.members.manage
      x-access: read
      x-requirements:
        - IAM-001
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Completed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /memberships/{id}/deactivate:
    post:
      operationId: deactivateMembership
      tags:
        - Administration
      summary: Deactivate membership
      description: Revocation immediately blocks access and signing (IAM-004). The last active owner cannot be deactivated (SOD-5).
      x-permission: tenant.members.manage
      x-access: protective-admin
      x-requirements:
        - IAM-002
        - IAM-004
        - AUD-001
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipDeactivateRequest"
      responses:
        "200":
          description: Completed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /memberships/{id}/role-grants:
    get:
      operationId: listRoleGrants
      tags:
        - Administration
      summary: List role grants of a membership
      x-permission: tenant.members.manage
      x-access: read
      x-requirements:
        - IAM-001
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active flag; omitted returns both.
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrantPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRoleGrant
      tags:
        - Administration
      summary: Grant role
      description: A caller cannot grant QA signing permissions to themselves (SOD-3). TenantOwner is never granted here (SOD-5). BillingAdministrator requires billing.delegate (SOD-6).
      x-permission: tenant.members.manage
      x-access: team-admin
      x-requirements:
        - IAM-001
        - AUD-001
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleGrantRequest"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /role-grants/{id}/revoke:
    post:
      operationId: revokeRoleGrant
      tags:
        - Administration
      summary: Revoke role grant
      x-permission: tenant.members.manage
      x-access: protective-admin
      x-requirements:
        - IAM-001
        - AUD-001
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRoleGrantRequest"
      responses:
        "200":
          description: Completed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      description: TenantOwner is never revoked here (SOD-5). BillingAdministrator requires billing.delegate (SOD-6).
  /configuration:
    get:
      operationId: getConfiguration
      tags:
        - Configuration
      summary: Current tenant configuration
      x-permission: catalog.read
      x-access: read
      x-requirements:
        - CFG-001
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Completed.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /configuration/versions:
    get:
      operationId: listConfigurationVersions
      tags:
        - Configuration
      summary: Configuration history
      x-permission: tenant.config.manage
      x-access: read
      x-requirements:
        - CFG-001
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfigurationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createConfigurationVersion
      tags:
        - Configuration
      summary: Publish new configuration version
      description: If-Match carries the current configuration version. Applies prospectively; existing reservations are revalidated before pick and dispatch (CFG-001).
      x-permission: tenant.config.manage
      x-access: routine-write
      x-requirements:
        - CFG-001
        - AUD-001
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConfigurationVersionRequest"
      responses:
        "201":
          description: Created.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfiguration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /units:
