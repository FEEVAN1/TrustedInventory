        - version
        - createdAt
        - updatedAt
        - zoneId
        - deviceId
        - storageProfileId
        - status
        - late
        - startedAt
        - endedAt
        - firstAbnormalCelsius
        - lastAbnormalCelsius
        - minCelsius
        - maxCelsius
        - affectedBucketIds
        - affectedProductIds
        - affectedLotIds
        - potentiallyAffectedShipmentIds
        - disposition
