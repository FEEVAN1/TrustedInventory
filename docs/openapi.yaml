        - UNAUTHENTICATED
        - FORBIDDEN
        - REAUTH_REQUIRED
        - NOT_FOUND
        - INSUFFICIENT_STOCK
        - STOCK_BLOCKED
        - INVALID_STATE
        - IDEMPOTENCY_MISMATCH
        - APPROVAL_STALE
        - APPROVAL_SELF
        - COUNT_LOCKED
        - RETRYABLE_CONFLICT
        - VERSION_CONFLICT
        - PRECONDITION_REQUIRED
        - VALIDATION_FAILED
        - OVER_RECEIPT
        - INCOMPATIBLE_BIN
        - BARCODE_CONFLICT
        - UNKNOWN_BARCODE
        - MISSING_MEDICAL_EVIDENCE
        - RELEASE_INELIGIBLE
        - DUPLICATE_SERIAL
        - RETURN_EXCEEDS_SHIPPED
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - SUBSCRIPTION_RESTRICTED
        - TENANT_SECURITY_SUSPENDED
        - FEATURE_NOT_ENABLED
        - TRIAL_NOT_ELIGIBLE
        - PLAN_LIMIT_REACHED
        - DOWNGRADE_BLOCKED
        - RETENTION_BLOCKED
