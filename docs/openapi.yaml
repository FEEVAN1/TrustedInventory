# TrustedInventory API contract (M0). Authored contract-first per DEC-003.
# Enumerations: docs/enums.md. Permissions: docs/permissions.md. Do not edit enum values here without updating both.
openapi: 3.1.0
info:
  title: TrustedInventory API
  version: 0.1.0-m0
  summary: Multi-tenant warehouse and inventory management for general and medical goods.
  license:
    name: Proprietary
    identifier: LicenseRef-TrustedInventory-Proprietary
  description: |-
    Contract-first API (DEC-003). This document is the M0 contract; from M1 the generated document must match it for implemented routes.

    ## Conventions (spec section 15)
    - Base path `/api/v1`; health probes are at the host root.
    - camelCase JSON, UUID strings, UTC ISO-8601 timestamps, `YYYY-MM-DD` dates. Enum values are case-sensitive.
    - Quantities are decimal **strings** with up to six fractional digits (DEC-014).
    - `X-Tenant-Id` selects the tenant and is validated against an active membership on every tenant route (API-001, IAM-002). Device credentials and `/platform/*` routes carry no tenant header.
    - `Idempotency-Key` (UUID) is required on every stock-changing POST, marked `x-stock-command: true`. Same key and payload replay the stored response; a different payload returns 409 `IDEMPOTENCY_MISMATCH` (STK-007).
    - `If-Match` with the quoted integer version is required on every PATCH and on every state-transition POST addressed to an existing resource (`/{collection}/{id}/...`). Missing: 428 `PRECONDITION_REQUIRED`; stale: 412 `VERSION_CONFLICT` (API-002). Collection-level commands (`/inventory/receive`, `/putaway/confirm`, `/inventory/bin-transfers`, `/orders/allocate-fefo`, `/quality/*`, `/returns`, `/recalls`, `/telemetry/readings`) identify targets in the body and are protected by idempotency keys and server-side row locks instead.
    - Command bodies never accept actor identifiers or tenant ownership fields (API-002).
    - Lists return `{items, nextCursor}`; default limit 50, maximum 200; default sort `createdAt` descending then `id` (API-004).
    - Errors use `application/problem+json` with the `Problem` schema. 404 means absent within the caller's authorized scope and never reveals another tenant's data.

    ## Extensions
    - `x-permission`: permission from docs/permissions.md. `authenticated` = any signed-in principal; `none` = public; `a|b` = either permission, with the rule stated in the description.
    - `x-requirements`: specification requirement and acceptance IDs the operation implements.
    - `x-stock-command`: stock-changing command requiring `Idempotency-Key`.
servers:
  - url: /api/v1
security:
  - oidc: []
tags:
  - name: Health
    description: Liveness and readiness probes (ARC-004).
  - name: Identity
    description: Current principal and tenant memberships.
  - name: Platform
    description: Tenant provisioning; no tenant stock access (section 05).
  - name: Administration
    description: Memberships and role grants (IAM-001).
  - name: Configuration
    description: Versioned tenant configuration (CFG-001).
  - name: Catalog
    description: Units, storage profiles, products, barcodes, partners, lots and serials (section 07).
  - name: Locations
    description: Warehouses, zones and bins (section 07).
  - name: PurchaseOrders
    description: Operational purchase orders (INB-001).
  - name: Receiving
    description: Barcode receiving and receipt posting (INB-002 to INB-004).
  - name: Putaway
    description: Recommended, scan-confirmed putaway (INB-005, INB-006).
  - name: Stock
    description: Stock buckets and the movement ledger (section 09).
  - name: Orders
    description: Outbound orders, allocation and reservations (OUT-001, OUT-002).
  - name: Picking
    description: Scan-validated picking and unpick (OUT-003, OUT-004).
  - name: Dispatch
    description: Dispatch and shipments (OUT-005).
  - name: Transfers
    description: Warehouse transfers through transit (EXC-001).
  - name: Counts
    description: Blind stock counts with independent approval (EXC-003).
  - name: Adjustments
    description: Approved stock adjustments (EXC-004).
  - name: Returns
    description: Customer returns into quarantine (EXC-005).
  - name: Recalls
    description: Recall blocking, impact and closure (EXC-006, EXC-007).
  - name: Quality
    description: Quality status transitions and dispositions (section 13).
  - name: Approvals
    description: Version-bound approvals and signatures (IAM-003, IAM-004).
  - name: Tasks
    description: Putaway, rework and exception tasks.
  - name: Telemetry
    description: Devices, readings and excursions (TEL-001 to TEL-005).
  - name: Alerts
    description: Operational and quality alerts.
  - name: Traceability
    description: Receipt-to-customer lot lineage.
  - name: Audit
    description: Hash-chained audit events (AUD-001 to AUD-003).
  - name: Exports
    description: Asynchronous controlled exports (AUD-004).
  - name: Attachments
    description: Scanned evidence attachments (TEN-005).
paths:
  /health/live:
    servers:
      - url: /
        description: Health endpoints are served at the host root, outside /api/v1.
    get:
      operationId: getLiveness
      tags:
        - Health
      summary: Liveness probe
      description: Process is running. Performs no dependency checks.
      security: []
      x-permission: none
      x-requirements:
        - ARC-004
        - API-001
      responses:
        "200":
          description: Healthy.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Healthy
        "503":
          description: Unhealthy.
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Unhealthy
                  - Degraded
  /health/ready:
