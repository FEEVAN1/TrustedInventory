    SetupItemStatus:
      type: string
      enum:
        - Done
        - Pending
        - Unavailable
      description: Unavailable means the capability does not exist yet (import).
    SetupItem:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/SetupItemKey"
        status:
          $ref: "#/components/schemas/SetupItemStatus"
        required:
          type: boolean
      required:
        - key
        - status
        - required
      additionalProperties: false
    SetupChecklist:
      type: object
      description: Computed setup progress (ONB-004). Limits and usage are in Entitlements.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SetupItem"
        requiredCompleted:
          type: integer
          minimum: 0
        requiredTotal:
          type: integer
          minimum: 0
        trialEnd:
          description: End of the trial while Trialing, so the screen can show trial days; otherwise null.
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      required:
        - items
        - requiredCompleted
        - requiredTotal
        - trialEnd
      additionalProperties: false
    Entitlements:
      type: object
      description: Current entitlement snapshot (ENT-002). Feature and limit decisions only; no billing details.
