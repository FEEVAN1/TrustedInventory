            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        disposition:
          anyOf:
            - $ref: "#/components/schemas/ExcursionDisposition"
            - type: "null"
        resolvedBy:
          type:
            - string
            - "null"
          maxLength: 255
          description: OIDC subject of a principal.
        resolvedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        approvalId:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
