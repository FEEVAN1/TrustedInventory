      properties:
        id:
          $ref: "#/components/schemas/Uuid"
          readOnly: true
        version:
          type: integer
          format: int32
          minimum: 1
          description: Optimistic concurrency version, returned as the quoted ETag (API-002).
          readOnly: true
        createdAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        createdBy:
          type: string
          maxLength: 255
          description: OIDC subject of a principal.
          readOnly: true
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
          readOnly: true
        zoneId:
          $ref: "#/components/schemas/Uuid"
        deviceId:
          $ref: "#/components/schemas/Uuid"
        storageProfileId:
          $ref: "#/components/schemas/Uuid"
        status:
          $ref: "#/components/schemas/ExcursionStatus"
        late:
          type: boolean
        startedAt:
          $ref: "#/components/schemas/Timestamp"
        endedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
