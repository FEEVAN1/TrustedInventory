          uniqueItems: true
        affectedProductIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          uniqueItems: true
        affectedLotIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          uniqueItems: true
        potentiallyAffectedShipmentIds:
