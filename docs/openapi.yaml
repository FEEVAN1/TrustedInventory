  /platform/v1/billing/complimentary-access:
    servers:
      - url: /
        description: Platform console routes are served at /platform/v1, outside /api/v1 (DEC-037).
    get:
      operationId: listComplimentaryAccess
      tags:
        - PlatformBilling
      summary: List complimentary access grants
      description: Newest first. Status is computed at the request time (Pending, Active, Expired, Revoked) (section 29, DEC-094).
      x-permission: platform.tenants.manage|platform.billing.manage
      x-access: platform
      x-requirements:
        - BIL-008
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
